<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlamBot Search</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Playfair Display', serif;
            background: transparent;
            padding: 20px;
        }
        
        .search-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .search-box {
            width: 100%;
            padding: 20px 80px 20px 80px;
            border: 2px solid #c89fff;
            border-radius: 15px;
            background: #d7afff;
            font-size: 18px;
            color: #ffffff;
            outline: none;
            box-shadow: 0 6px 15px rgba(215, 175, 255, 0.3);
            font-weight: 500;
            font-family: 'Playfair Display', serif;
        }
        
        .search-box::placeholder {
            color: #ffffff;
            font-family: 'Playfair Display', serif;
        }
        
        .search-box:focus {
            background: #c89fff;
            border-color: #b87fff;
            box-shadow: 0 8px 20px rgba(215, 175, 255, 0.5);
        }
        
        .search-icon {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
        }
        
        .search-icon:hover {
            transform: translateY(-50%) scale(1.1);
        }
        
        .search-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }
        
        .mic-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
        }
        
        .mic-icon:hover {
            transform: translateY(-50%) scale(1.1);
        }
        
        .mic-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }
        
        .results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #d7afff;
            border: 2px solid #c89fff;
            border-radius: 15px;
            margin-top: 8px;
            box-shadow: 0 8px 25px rgba(215, 175, 255, 0.4);
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        
        .result-item {
            padding: 18px 25px;
            cursor: pointer;
            border-bottom: 1px solid #c89fff;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Playfair Display', serif;
        }
        
        .result-item:hover {
            background: #c89fff;
            color: #ffffff;
        }
        
        .result-item:last-child {
            border-bottom: none;
            border-radius: 0 0 13px 13px;
        }
        
        .result-item:first-child {
            border-radius: 13px 13px 0 0;
        }
        
        .no-results {
            padding: 24px;
            text-align: center;
            color: #6B7280;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" class="search-box" placeholder="GlamBot Assist Presents..." id="searchInput">
        <button class="mic-icon" title="Voice Search">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        <button class="search-icon" title="Search">
            <svg viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </button>
        
        <div class="results-dropdown" id="resultsDropdown">
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        const youtubeTitles = [
            "How to Automate Your Acuity Booking Site",
            "How to Scale Your Beauty Business With Automation",
            "How to Build Your First Chatbot in 30 Minutes",
            "How to Automate SMS/Email Campaigns",
            "How to Automate You Busiest Admin Tasks",
            "How to Turn After-Hours Inquiries Into Booked Appointments with Acuity Automation",
            "Acuity Scheduling ChatBot Integration That Books Clients Automatically"
        ];

        const searchInput = document.getElementById('searchInput');
        const resultsDropdown = document.getElementById('resultsDropdown');
        const resultsList = document.getElementById('resultsList');

        function searchTitles(query) {
            if (!query.trim()) return [];
            return youtubeTitles.filter(title => 
                title.toLowerCase().includes(query.toLowerCase())
            );
        }

        function displayResults(results) {
            resultsList.innerHTML = '';
            
            if (results.length === 0) {
                resultsList.innerHTML = '<div class="no-results">No matching titles found</div>';
            } else {
                results.forEach(title => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.textContent = title;
                    resultItem.addEventListener('click', () => {
                        searchInput.value = title;
                        hideResults();
                        // Send message to parent window (Wix) if needed
                        if (window.parent) {
                            window.parent.postMessage({
                                type: 'videoSelected',
                                title: title
                            }, '*');
                        }
                    });
                    resultsList.appendChild(resultItem);
                });
            }
        }

        function showResults() {
            resultsDropdown.style.display = 'block';
        }

        function hideResults() {
            resultsDropdown.style.display = 'none';
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            const results = searchTitles(query);
            
            if (query.trim() && results.length > 0) {
                displayResults(results);
                showResults();
            } else if (query.trim() && results.length === 0) {
                displayResults([]);
                showResults();
            } else {
                hideResults();
            }
        });

        searchInput.addEventListener('focus', (e) => {
            if (e.target.value.trim()) {
                const results = searchTitles(e.target.value);
                if (results.length > 0) {
                    displayResults(results);
                    showResults();
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                hideResults();
            }
        });
    </script>
</body>
</html>
